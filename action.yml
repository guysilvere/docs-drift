name: 'docs-drift-cli'
description: 'Vérifie la cohérence stricte entre documentation Markdown et code réel (100 % local, sans exécution de code tiers)'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  cwd:
    description: 'Dossier du dépôt à analyser'
    required: false
    default: '.'
  format:
    description: 'Format de sortie : text, json, sarif ou markdown'
    required: false
    default: 'text'
  stale:
    description: 'Seuil de fraîcheur Git optionnel (ex. 90d, 12w, 48h)'
    required: false
    default: ''
  output-file:
    description: 'Fichier optionnel où écrire le rapport (ex. docs-drift.sarif)'
    required: false
    default: ''
  node-version:
    description: 'Version Node.js (>= 20)'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build docs-drift
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npm run build

    - name: Run docs-drift
      shell: bash
      env:
        INPUT_CWD: ${{ inputs.cwd }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_STALE: ${{ inputs.stale }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        ARGS=(check --cwd "$INPUT_CWD" --format "$INPUT_FORMAT")
        if [ -n "$INPUT_STALE" ]; then
          ARGS+=(--stale "$INPUT_STALE")
        fi
        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          node "${{ github.action_path }}/dist/cli.js" "${ARGS[@]}" > "$INPUT_OUTPUT_FILE"
        else
          node "${{ github.action_path }}/dist/cli.js" "${ARGS[@]}"
        fi
